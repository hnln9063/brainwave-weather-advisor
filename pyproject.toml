[project]
name = "brainwave-weather-advisor"
version = "0.1.0"
description = "Policy-grounded weather advice with LangGraph"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "streamlit>=1.40,<2", "httpx>=0.27,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
